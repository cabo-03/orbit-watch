name: Update data and publish

# How this runs:
#  1. A built-in timer (the "next-run" job): every run waits until the next 3-hour slot and then
#     starts the following run itself. This is the main clock.
#  2. GitHub's scheduler, as a watchdog only: a scheduled run first checks whether the timer is
#     already waiting. If it is, the scheduled run does nothing, so updates never double up.
#     If the timer has stopped (for example after a GitHub outage), it updates and restarts it.
#  3. Every upload to the repository, and the "Run workflow" button on the Actions tab.
on:
  schedule:
    - cron: "37 */3 * * *"   # watchdog, 20 minutes after each update slot (UTC)
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write             # lets the timer start the next run and the watchdog look for it

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      go: ${{ steps.decide.outputs.go }}
    steps:
      - id: decide
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then echo "go=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          others=$(gh run list --repo "${{ github.repository }}" --workflow update.yml --status in_progress \
                     --json databaseId --jq "[.[] | select(.databaseId != ${{ github.run_id }})] | length")
          if [ "$others" -gt 0 ]; then
            echo "The 3-hour timer is running, so this scheduled check has nothing to do."
            echo "go=false" >> "$GITHUB_OUTPUT"
          else
            echo "No timer found. Updating now and restarting the timer."
            echo "go=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: check
    if: ${{ needs.check.outputs.go == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - id: pages
        uses: actions/configure-pages@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Download fresh orbit and event data
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}
        run: python scripts/update_data.py site/data

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  next-run:
    # Runs even if the update failed, so one bad run never stops the clock.
    needs: [check, build, deploy]
    if: ${{ always() && needs.check.outputs.go == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 200
    # Only one timer may exist: a newer run's timer replaces any older one.
    concurrency:
      group: next-run-timer
      cancel-in-progress: true
    steps:
      - name: Wait for the next 3-hour slot
        run: |
          now=$(date -u +%s)
          offset=$((17 * 60))
          next=$(( ((now - offset) / 10800 + 1) * 10800 + offset ))
          # if the slot is under 20 minutes away, skip to the one after
          if [ $((next - now)) -lt 1200 ]; then next=$((next + 10800)); fi
          echo "Next update at $(date -u -d @$next '+%Y-%m-%d %H:%M UTC'), waiting $(( (next - now) / 60 )) minutes"
          sleep $((next - now))

      - name: Start the next update
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run update.yml --repo "${{ github.repository }}" --ref main
